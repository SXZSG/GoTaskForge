name: gotaskforge
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gotaskforge
      MYSQL_USER: taskforge
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
    networks: [private]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  mock-a:
    build: .
    command: ["/usr/local/bin/mockllm"]
    environment:
      MOCK_ADDR: 0.0.0.0:8091
      MOCK_NAME: mock-a
      MOCK_DELAY_MS: 30
    networks: [private]
  mock-b:
    build: .
    command: ["/usr/local/bin/mockllm"]
    environment:
      MOCK_ADDR: 0.0.0.0:8091
      MOCK_NAME: mock-b
      MOCK_DELAY_MS: 60
    networks: [private]
  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      mock-a: {condition: service_started}
      mock-b: {condition: service_started}
    environment:
      ADDR: 0.0.0.0:8080
      STORAGE_BACKEND: mysql
      MYSQL_DSN: "taskforge:${MYSQL_PASSWORD}@tcp(mysql:3306)/gotaskforge?parseTime=true&loc=UTC&timeout=5s&readTimeout=5s&writeTimeout=5s"
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${TASKFORGE_API_KEY:?set TASKFORGE_API_KEY in .env}
      PROVIDER: ${PROVIDER:-mock}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKERS: ${WORKERS:-4}
      MAX_PENDING: ${MAX_PENDING:-100}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      TASK_TIMEOUT_SEC: ${TASK_TIMEOUT_SEC:-30}
      RATE_PER_MINUTE: ${RATE_PER_MINUTE:-60}
      GATEWAY_BACKENDS: "http://mock-a:8091/v1,http://mock-b:8091/v1"
      GATEWAY_ALLOW_HTTP: "true" # only for internal demo containers; use HTTPS for real services
      GATEWAY_MAX_PER_BACKEND: ${GATEWAY_MAX_PER_BACKEND:-4}
      GATEWAY_TIMEOUT_SEC: ${GATEWAY_TIMEOUT_SEC:-90}
      GATEWAY_FAILURE_THRESHOLD: ${GATEWAY_FAILURE_THRESHOLD:-3}
      GATEWAY_COOLDOWN_SEC: ${GATEWAY_COOLDOWN_SEC:-15}
      GATEWAY_UPSTREAM_KEY: ${GATEWAY_UPSTREAM_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
volumes:
  mysql_data:
  redis_data:
networks:
  private:
    driver: bridge
