name: Go CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependency checksums
        run: go mod verify
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Build
        run: go build ./...
      - name: Core tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Compile full MySQL build
        run: |
          go test -tags mysql ./...
          go vet -tags mysql ./...
          go build -tags mysql ./cmd/server
          go build ./cmd/mockllm
          go build ./cmd/loadgen
